<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#4C1D95"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#67E8F9"/>
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <!-- Connection lines from nodes to socket -->
  <g stroke="#38BDF8" stroke-width="22" stroke-linecap="round" opacity="0.9">
    <line x1="352" y1="330" x2="352" y2="560"/>
    <line x1="512" y1="330" x2="512" y2="560"/>
    <line x1="672" y1="330" x2="672" y2="560"/>
    <line x1="352" y1="300" x2="672" y2="300" opacity="0.7"/>
  </g>

  <!-- Glow halos behind nodes -->
  <g fill="url(#glow)" opacity="0.8">
    <circle cx="352" cy="300" r="90"/>
    <circle cx="512" cy="300" r="90"/>
    <circle cx="672" cy="300" r="90"/>
  </g>

  <!-- Nodes -->
  <g fill="#67E8F9">
    <circle cx="352" cy="300" r="44"/>
    <circle cx="512" cy="300" r="44"/>
    <circle cx="672" cy="300" r="44"/>
  </g>

  <!-- Socket body -->
  <rect x="292" y="560" width="440" height="400" rx="90" fill="#FFFFFF"/>

  <!-- Socket slots -->
  <rect x="402" y="650" width="56" height="150" rx="28" fill="#1E1B4B"/>
  <rect x="566" y="650" width="56" height="150" rx="28" fill="#1E1B4B"/>

  <!-- Ground hole -->
  <circle cx="512" cy="870" r="42" fill="#1E1B4B"/>
</svg>
