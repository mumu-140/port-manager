name: CI Windows

on:
  push:
    branches: [main]
    paths:
      - 'platforms/windows/**'
      - '.github/workflows/ci-windows.yml'
      - '.github/workflows/release.yml'
    tags-ignore:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
    paths:
      - 'platforms/windows/**'
      - '.github/workflows/ci-windows.yml'
      - '.github/workflows/release.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore platforms/windows/PortKiller.sln

      - name: Test (Debug)
        run: dotnet test platforms/windows/PortKiller.sln -c Debug --no-restore

      - name: Build (Debug)
        run: dotnet build platforms/windows/PortKiller/PortKiller.csproj -c Debug --no-restore

      - name: Build (Release x64)
        run: dotnet publish platforms/windows/PortKiller/PortKiller.csproj -c Release -r win-x64 --self-contained false

      - name: Build (Release arm64)
        run: dotnet publish platforms/windows/PortKiller/PortKiller.csproj -c Release -r win-arm64 --self-contained false

      - name: Verify build outputs
        run: |
          Write-Host "Checking build outputs..."

          # Find the actual publish directories
          $x64Exe = Get-ChildItem -Path platforms/windows/PortKiller -Recurse -Filter "PortKiller.exe" | Where-Object { $_.FullName -like "*win-x64*" } | Select-Object -First 1
          $arm64Exe = Get-ChildItem -Path platforms/windows/PortKiller -Recurse -Filter "PortKiller.exe" | Where-Object { $_.FullName -like "*win-arm64*" } | Select-Object -First 1

          if ($x64Exe) {
            Write-Host "x64 build exists: $($x64Exe.FullName)"
            $size = $x64Exe.Length / 1MB
            Write-Host "  Size: $([math]::Round($size, 2)) MB"
          } else {
            Write-Error "x64 build missing!"
            exit 1
          }

          if ($arm64Exe) {
            Write-Host "arm64 build exists: $($arm64Exe.FullName)"
            $size = $arm64Exe.Length / 1MB
            Write-Host "  Size: $([math]::Round($size, 2)) MB"
          } else {
            Write-Error "arm64 build missing!"
            exit 1
          }

      - name: Create test packages
        run: |
          # Create directories for artifacts
          New-Item -ItemType Directory -Force -Path artifacts/win-x64
          New-Item -ItemType Directory -Force -Path artifacts/win-arm64

          # Copy x64 build
          $x64Publish = Get-ChildItem -Path platforms/windows/PortKiller -Recurse -Directory | Where-Object { $_.FullName -like "*win-x64*publish*" } | Select-Object -First 1
          if ($x64Publish) {
            Copy-Item -Path "$($x64Publish.FullName)/*" -Destination artifacts/win-x64 -Recurse
          }

          # Copy arm64 build
          $arm64Publish = Get-ChildItem -Path platforms/windows/PortKiller -Recurse -Directory | Where-Object { $_.FullName -like "*win-arm64*publish*" } | Select-Object -First 1
          if ($arm64Publish) {
            Copy-Item -Path "$($arm64Publish.FullName)/*" -Destination artifacts/win-arm64 -Recurse
          }

      - name: Upload x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortKiller-windows-x64
          path: artifacts/win-x64
          retention-days: 7

      - name: Upload arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortKiller-windows-arm64
          path: artifacts/win-arm64
          retention-days: 7

      - name: Comment on PR with download links
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `## 🧪 Windows Test Builds Ready!

            | Platform | Download |
            |----------|----------|
            | Windows x64 | [PortKiller-windows-x64](${runUrl}#artifacts) |
            | Windows ARM64 | [PortKiller-windows-arm64](${runUrl}#artifacts) |

            > **Note:** Requires [.NET 9 Runtime](https://dotnet.microsoft.com/download/dotnet/9.0) to run.
            > Artifacts expire in 7 days.

            ---
            <sub>🤖 Auto-generated by CI</sub>`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => c.body.includes('Windows Test Builds Ready'));

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # Opt-in app-quit survival test (design notes, section 6.5). Enable by adding
  # the `survival-smoke` label to the pull request; it launches a real managed
  # service, lets the launching process exit, then proves in a fresh process
  # that the child survived and is reported as an unowned Conflict.
  survival:
    name: Survival Smoke
    runs-on: windows-latest
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'survival-smoke')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run app-quit survival smoke
        shell: pwsh
        run: ./platforms/windows/scripts/smoke-service-survival.ps1

  # Opt-in GUI smoke test. Enable by adding the `gui-smoke` label to the pull
  # request. It publishes the win-x64 artifact, launches the real WPF app and
  # drives it with UI Automation through lifecycle, threading, edit, conflict
  # and delete, uploading tree dumps and screenshots as evidence.
  gui-smoke:
    name: GUI Smoke
    runs-on: windows-latest
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'gui-smoke')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run GUI smoke
        shell: pwsh
        run: ./platforms/windows/scripts/smoke-gui.ps1

      - name: Upload GUI smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke-evidence
          path: artifacts/gui-smoke-evidence
          retention-days: 7
