# Manual/comment-triggered macOS PR build.
# Uses the repository-local release workflow in artifact-only mode.
name: PR Build Test

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to build'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  setup:
    name: Resolve PR
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '/test-build'))
    outputs:
      ref: ${{ steps.pr.outputs.ref }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
    steps:
      - name: Resolve PR branch
        id: pr
        uses: actions/github-script@v7
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const prNumber = process.env.INPUT_PR_NUMBER || context.issue.number;
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(prNumber)
            });
            core.setOutput('ref', pr.data.head.ref);
            core.setOutput('pr_number', String(prNumber));

  build:
    name: Build macOS artifact
    needs: setup
    uses: ./.github/workflows/release.yml
    with:
      is_pr_build: true
      pr_number: ${{ needs.setup.outputs.pr_number }}
      version_override: 'v0.0.0-pr${{ needs.setup.outputs.pr_number }}'
      ref: ${{ needs.setup.outputs.ref }}

  comment:
    name: Comment artifact link
    needs: [setup, build]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.build.result == 'success' }}
    steps:
      - name: Post download instructions
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.setup.outputs.pr_number }}
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = [
              '## macOS test build ready',
              '',
              `Download the artifact from [this workflow run](${runUrl}#artifacts).`,
              '',
              '_This is an unsigned/unnotarized CI test build, not a production release._'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body
            });
