name: Survival Smoke (Windows)

# Opt-in app-quit survival test (design notes, section 6.5). It launches a real
# managed service through the production manager, lets the launching process
# exit, then proves in a fresh process that the child survived and is reported
# as an unowned Conflict. Run manually, not on every pull request.
on:
  workflow_dispatch:

jobs:
  survival:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run app-quit survival smoke
        shell: pwsh
        run: ./platforms/windows/scripts/smoke-service-survival.ps1
