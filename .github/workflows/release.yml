name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for a dry-run build (e.g. v0.0.0-test)'
        required: true
        default: 'v0.0.0-test'
        type: string
  workflow_call:
    inputs:
      is_pr_build:
        description: 'Build only the macOS PR artifact'
        type: boolean
        default: false
      pr_number:
        description: 'PR number for artifact naming'
        type: string
        default: ''
      version_override:
        description: 'Version override for reusable builds'
        type: string
        default: ''
      ref:
        description: 'Git ref to checkout'
        type: string
        default: ''

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ inputs.version_override || inputs.version || github.ref_name }}

jobs:
  create-release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Create release from pushed tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "PortKiller $RELEASE_VERSION" \
            --generate-notes

  build-macos:
    name: Build macOS
    needs: create-release
    if: ${{ always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: platforms/macos
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build universal app bundle
        run: ./scripts/build-app.sh

      - name: Package macOS app
        run: |
          ARCHIVE="PortKiller-$RELEASE_VERSION-macos-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            ".build/apple/Products/Release/PortKiller.app" "$ARCHIVE"
          echo "MACOS_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_VERSION" "$MACOS_ARCHIVE" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload CI artifact
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
        uses: actions/upload-artifact@v4
        with:
          name: PortKiller-macOS-${{ inputs.pr_number || github.run_number }}
          path: platforms/macos/PortKiller-*-macos-universal.zip
          retention-days: 7
          if-no-files-found: error

  build-windows:
    name: Build Windows
    needs: create-release
    if: ${{ always() && !inputs.is_pr_build && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore platforms/windows/PortKiller/PortKiller.csproj

      - name: Publish x64
        run: dotnet publish platforms/windows/PortKiller/PortKiller.csproj -c Release -r win-x64 --self-contained false -o publish/win-x64

      - name: Publish arm64
        run: dotnet publish platforms/windows/PortKiller/PortKiller.csproj -c Release -r win-arm64 --self-contained false -o publish/win-arm64

      - name: Package Windows builds
        shell: pwsh
        run: |
          Compress-Archive -Path publish/win-x64/* -DestinationPath "PortKiller-$env:RELEASE_VERSION-windows-x64.zip"
          Compress-Archive -Path publish/win-arm64/* -DestinationPath "PortKiller-$env:RELEASE_VERSION-windows-arm64.zip"

      - name: Upload to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload "$env:RELEASE_VERSION" `
            "PortKiller-$env:RELEASE_VERSION-windows-x64.zip" `
            "PortKiller-$env:RELEASE_VERSION-windows-arm64.zip" `
            --clobber --repo "$env:GITHUB_REPOSITORY"

      - name: Upload Windows artifacts
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
        uses: actions/upload-artifact@v4
        with:
          name: PortKiller-Windows-${{ github.run_number }}
          path: PortKiller-*-windows-*.zip
          retention-days: 7

  build-linux:
    name: Build Linux
    needs: create-release
    if: ${{ always() && !inputs.is_pr_build && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3 python3-gi python3-gi-cairo \
            gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 \
            librsvg2-bin desktop-file-utils file

      - name: Build AppImage
        run: |
          APPDIR=AppDir
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/port-killer"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/scalable/apps"

          cp -r platforms/linux/src "$APPDIR/usr/share/port-killer/"
          cp platforms/linux/port-killer.py "$APPDIR/usr/share/port-killer/"
          chmod +x "$APPDIR/usr/share/port-killer/port-killer.py"

          cp platforms/macos/Resources/AppIcon.svg "$APPDIR/usr/share/icons/hicolor/scalable/apps/port-killer.svg"
          cp platforms/macos/Resources/AppIcon.svg "$APPDIR/port-killer.svg"
          rsvg-convert -w 256 -h 256 platforms/macos/Resources/AppIcon.svg -o "$APPDIR/port-killer.png"

          cat > "$APPDIR/usr/share/applications/port-killer.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=PortKiller
          Comment=Monitor listening ports and terminate processes from system tray
          Exec=port-killer
          Icon=port-killer
          Terminal=false
          Categories=Development;
          StartupNotify=false
          StartupWMClass=port-killer
          DESKTOP
          cp "$APPDIR/usr/share/applications/port-killer.desktop" "$APPDIR/port-killer.desktop"
          desktop-file-validate "$APPDIR/port-killer.desktop"

          cat > "$APPDIR/usr/bin/port-killer" <<'LAUNCH'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          APPROOT="$(dirname "$(dirname "$HERE")")"
          exec python3 "$APPROOT/usr/share/port-killer/port-killer.py" "$@"
          LAUNCH
          chmod +x "$APPDIR/usr/bin/port-killer"
          ln -s usr/bin/port-killer "$APPDIR/AppRun"

          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool

          ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
            "$APPDIR" "PortKiller-$RELEASE_VERSION-linux-x86_64.AppImage"

      - name: Verify AppImage
        run: |
          FILE="PortKiller-$RELEASE_VERSION-linux-x86_64.AppImage"
          [ -f "$FILE" ] || { echo "AppImage not produced"; exit 1; }
          chmod +x "$FILE"
          ./"$FILE" --appimage-extract >/dev/null
          [ -f squashfs-root/usr/share/port-killer/port-killer.py ] || exit 1
          [ -f squashfs-root/usr/share/port-killer/src/ui/tray.py ] || exit 1
          [ -x squashfs-root/AppRun ] || exit 1
          rm -rf squashfs-root

      - name: Upload to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_VERSION" "PortKiller-$RELEASE_VERSION-linux-x86_64.AppImage" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload Linux artifact
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
        uses: actions/upload-artifact@v4
        with:
          name: PortKiller-Linux-${{ github.run_number }}
          path: PortKiller-*-linux-x86_64.AppImage
          retention-days: 7
